<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrixSwap - Uniswap Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <!-- Ethers.js library for Wallet Connection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <style>
        :root { 
            --theme-color: #00ff66; /* TrixSwap Neon Green */
            --bg-color: #020202;
            /* Uniswap Dark Mode Colors */
            --uni-bg: #0D111C;
            --uni-input-bg: #131A2A;
            --uni-hover: #1E293B;
            --uni-text-primary: #FFFFFF;
            --uni-text-secondary: #98A1C0;
            --uni-border: #1B2236;
        }

        body {
            background-color: var(--bg-color); margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.02) 3px, transparent 4px);
            transition: background 0.5s ease;
        }

        /* --- WALLET HUD (TOP RIGHT) --- */
        .wallet-hud {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.8); color: #fff; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
            border-radius: 12px; cursor: pointer; z-index: 100; display: flex; align-items: center; gap: 10px; transition: all 0.3s ease;
        }
        .wallet-hud:hover { border-color: var(--theme-color); box-shadow: 0 0 15px rgba(0,255,102,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3333; }
        .wallet-hud.connected .status-dot { background: #00ff66; box-shadow: 0 0 8px #00ff66; }

        /* --- BACKGROUND --- */
        .bg-title { position: absolute; top: 12%; font-size: 42px; font-weight: 900; letter-spacing: 12px; color: var(--theme-color); opacity: 0.9; text-shadow: 0 0 20px var(--theme-color); z-index: 5; transition: opacity 0.3s; }
        .bg-orb { position: absolute; top: 50%; left: 50%; width: 500px; height: 500px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--theme-color) 0%, transparent 70%); opacity: 0.06; z-index: 1; pointer-events: none; }

        /* --- HOLOGRAPHIC MECHANICS --- */
        .projector-wrap { position: absolute; bottom: 50px; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 50; transition: opacity 0.3s; }
        .projector { width: 80px; height: 25px; background: #fff; border-radius: 50%; box-shadow: 0 0 30px var(--theme-color), 0 0 60px var(--theme-color); }
        .projector-text { margin-top: 12px; color: var(--theme-color); font-size: 12px; letter-spacing: 4px; }
        .beam { position: absolute; bottom: 60px; width: 350px; height: 400px; background: linear-gradient(to top, rgba(255,255,255,0.1), transparent); clip-path: polygon(50% 100%, 0 0, 100% 0); opacity: 0; transform-origin: bottom center; transition: opacity 0.5s; pointer-events: none; }

        .scene { position: absolute; top: 25%; width: 300px; height: 200px; perspective: 1000px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
        .carousel { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .holo-item { position: absolute; width: 160px; height: 120px; left: 50%; top: 50%; margin-left: -80px; margin-top: -60px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.1; filter: blur(4px); transition: all 0.5s; }
        .holo-item .icon { font-size: 70px; margin-bottom: 10px; line-height: 1; }
        .holo-item .name { font-size: 22px; font-weight: 900; letter-spacing: 3px; }

        .item-0 { transform: rotateY(0deg) translateZ(180px); color: #00ff66; text-shadow: 0 0 20px #00ff66; }
        .item-1 { transform: rotateY(90deg) translateZ(180px); color: #00d4ff; text-shadow: 0 0 20px #00d4ff; }
        .item-2 { transform: rotateY(180deg) translateZ(180px); color: #b100ff; text-shadow: 0 0 20px #b100ff; }
        .item-3 { transform: rotateY(270deg) translateZ(180px); color: #ffea00; text-shadow: 0 0 20px #ffea00; }

        .holo-item.active { opacity: 1; filter: blur(0px); transform: scale(1.2); pointer-events: auto; cursor: pointer; }
        
        body.is-on .scene, body.is-on .beam { opacity: 1; }
        body.is-on .bg-title { opacity: 0.15; }

        /* --- THE UNISWAP-STYLE TERMINAL --- */
        .swap-card {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 440px; background: var(--uni-bg);
            border-radius: 24px; padding: 12px; z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Inter', sans-serif;
            border: 1px solid var(--uni-border);
            box-shadow: 0 40px 120px rgba(0, 255, 102, 0.1);
        }

        .swap-card.open { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }

        /* Header */
        .swap-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 12px 20px 12px; color: var(--uni-text-primary);
        }
        .swap-tabs { display: flex; gap: 15px; font-weight: 600; font-size: 16px; }
        .swap-tabs span.active { color: var(--uni-text-primary); }
        .swap-tabs span { color: var(--uni-text-secondary); cursor: pointer; transition: 0.2s; }
        .swap-tabs span:hover { color: var(--uni-text-primary); }
        .swap-settings { color: var(--uni-text-secondary); cursor: pointer; font-size: 18px; }
        .close-btn { background: none; border: none; color: var(--uni-text-secondary); font-size: 20px; cursor: pointer; padding: 0; }
        .close-btn:hover { color: #fff; }

        /* Input Sections */
        .input-section {
            background: var(--uni-input-bg);
            border-radius: 20px;
            padding: 16px;
            border: 1px solid transparent;
            transition: 0.2s;
            position: relative;
        }
        .input-section:hover, .input-section:focus-within { border-color: var(--uni-border); }

        .input-header { display: flex; justify-content: space-between; color: var(--uni-text-secondary); font-size: 14px; margin-bottom: 8px; font-weight: 500; }
        
        .input-row { display: flex; justify-content: space-between; align-items: center; }
        
        .input-row input {
            background: transparent; border: none; color: var(--uni-text-primary);
            font-size: 36px; width: 60%; font-family: 'Inter', sans-serif; font-weight: 500; outline: none;
            padding: 0; margin: 0;
        }
        .input-row input::placeholder { color: #5D6785; }

        /* Token Select Pill */
        .token-select {
            background: var(--uni-bg); border: 1px solid var(--uni-bg);
            padding: 6px 12px 6px 8px; border-radius: 20px; color: var(--uni-text-primary);
            font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 8px;
            cursor: pointer; transition: 0.2s; box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
        }
        .token-select:hover { background: var(--uni-hover); }
        .token-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; }
        .avax-icon { background: #E84142; }
        .usdc-icon { background: #2775CA; }

        .input-footer { display: flex; justify-content: space-between; color: var(--uni-text-secondary); font-size: 14px; margin-top: 8px; }

        /* The Overlapping Flip Button */
        .flip-container { position: relative; height: 4px; z-index: 2; display: flex; justify-content: center; align-items: center; }
        .flip-btn {
            background: var(--uni-input-bg); border: 4px solid var(--uni-bg);
            border-radius: 12px; width: 40px; height: 40px; color: var(--uni-text-primary);
            display: flex; justify-content: center; align-items: center; cursor: pointer;
            font-size: 16px; transition: 0.2s; padding: 0;
        }
        .flip-btn:hover { background: var(--uni-hover); }

        /* Execute Button */
        .action-btn {
            width: 100%; padding: 16px; background: rgba(0, 255, 102, 0.15); color: var(--theme-color);
            border: 1px solid rgba(0, 255, 102, 0.3); border-radius: 20px; font-size: 20px;
            font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; margin-top: 12px;
            transition: 0.2s;
        }
        .action-btn:hover { background: rgba(0, 255, 102, 0.25); border-color: var(--theme-color); }
        
        .action-btn.execute { background: var(--theme-color); color: #000; border: none; }
        .action-btn.execute:hover { background: #00e65c; }

        /* --- FLASH --- */
        .flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--theme-color); opacity: 0; pointer-events: none; z-index: 999; }
        .flash.fire { animation: slamFlash 0.5s ease-out; }
        @keyframes slamFlash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }

        body.terminal-active .scene, body.terminal-active .beam, body.terminal-active .projector-wrap { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Wallet Connect -->
    <div class="wallet-hud" id="wallet-btn">
        <div class="status-dot"></div>
        <span id="wallet-address">Connect Wallet</span>
    </div>

    <div class="bg-orb"></div>
    <div class="bg-title">TRIXSWAP</div>
    <div class="beam" id="beam"></div>

    <div class="scene" id="scene">
        <div class="carousel" id="carousel">
            <div class="holo-item item-0 active"><div class="icon">⇆</div><div class="name">SWAP</div></div>
            <div class="holo-item item-1"><div class="icon">🔗</div><div class="name">BRIDGE</div></div>
            <div class="holo-item item-2"><div class="icon">🌐</div><div class="name">CROSS</div></div>
            <div class="holo-item item-3"><div class="icon">💧</div><div class="name">POOLS</div></div>
        </div>
    </div>

    <div class="projector-wrap" id="projector">
        <div class="projector"></div>
        <div class="projector-text" id="p-text">TAP TO INITIALIZE</div>
    </div>

    <!-- UNISWAP STYLE TERMINAL -->
    <div class="swap-card" id="swap-terminal">
        
        <div class="swap-header">
            <div class="swap-tabs">
                <span class="active">Swap</span>
                <span>Buy</span>
            </div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span class="swap-settings">⚙️</span>
                <button class="close-btn" id="close-terminal">✖</button>
            </div>
        </div>
        
        <!-- Input Top (You Pay) -->
        <div class="input-section">
            <div class="input-header"><span>You pay</span></div>
            <div class="input-row">
                <input type="number" placeholder="0" id="pay-input">
                <button class="token-select">
                    <div class="token-icon avax-icon">🔺</div> AVAX <span>▼</span>
                </button>
            </div>
            <div class="input-footer">
                <span id="pay-usd">$0.00</span>
                <span>Balance: 0 <span style="color: var(--theme-color); cursor: pointer;">Max</span></span>
            </div>
        </div>

        <!-- Overlapping Flip Arrow -->
        <div class="flip-container">
            <button class="flip-btn">↓</button>
        </div>

        <!-- Input Bottom (You Receive) -->
        <div class="input-section">
            <div class="input-header"><span>You receive</span></div>
            <div class="input-row">
                <input type="number" placeholder="0" id="receive-input" readonly>
                <button class="token-select">
                    <div class="token-icon usdc-icon">🔵</div> USDC <span>▼</span>
                </button>
            </div>
            <div class="input-footer">
                <span id="receive-usd">$0.00</span>
                <span>Balance: 0</span>
            </div>
        </div>

        <!-- Dynamic Action Button -->
        <button class="action-btn" id="execute-swap-btn">Connect Wallet</button>
    </div>

    <div class="flash" id="flash"></div>

    <script>
        // --- WEB3 LOGIC ---
        const walletBtn = document.getElementById('wallet-btn');
        const walletAddressText = document.getElementById('wallet-address');
        const executeSwapBtn = document.getElementById('execute-swap-btn');
        let userAddress = null;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletAddressText.innerText = "Connecting...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    walletBtn.classList.add('connected');
                    walletAddressText.innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
                    
                    // Update Action button in terminal
                    executeSwapBtn.innerText = "Swap";
                    executeSwapBtn.classList.add('execute');
                } catch (error) {
                    walletAddressText.innerText = "Failed";
                    setTimeout(() => walletAddressText.innerText = "Connect Wallet", 2000);
                }
            } else {
                alert("Please install MetaMask or Core Wallet!");
            }
        }
        walletBtn.addEventListener('click', () => { if (!userAddress) connectWallet(); });

        // If user clicks the main terminal button while disconnected
        executeSwapBtn.addEventListener('click', () => {
            if (!userAddress) {
                connectWallet();
            } else {
                if(document.getElementById('pay-input').value > 0) {
                    executeSwapBtn.innerText = "Confirm in Wallet...";
                    setTimeout(() => {
                        alert("Transaction Sent!");
                        executeSwapBtn.innerText = "Swap";
                        document.getElementById('close-terminal').click();
                    }, 1500);
                } else {
                    alert("Enter an amount first.");
                }
            }
        });


        // --- UI LOGIC ---
        const body = document.body;
        const projector = document.getElementById('projector');
        const carousel = document.getElementById('carousel');
        const pText = document.getElementById('p-text');
        const flash = document.getElementById('flash');
        const swapTerminal = document.getElementById('swap-terminal');
        const closeTerminalBtn = document.getElementById('close-terminal');
        
        let isOn = false; let rotationY = 0; let activeIndex = 0;

        function executeSelection() {
            flash.classList.add('fire');
            
            setTimeout(() => {
                flash.classList.remove('fire');
                if (activeIndex === 0) { // SWAP selected
                    body.classList.add('terminal-active');
                    swapTerminal.classList.add('open');
                } else {
                    isOn = false; body.classList.remove('is-on'); pText.innerText = "TAP TO INITIALIZE";
                }
            }, 150);
        }

        projector.addEventListener('click', () => {
            if (!isOn) { isOn = true; body.classList.add('is-on'); pText.innerText = "SCROLL MOUSE | TAP TO EXECUTE"; } 
            else { executeSelection(); }
        });

        document.querySelectorAll('.holo-item').forEach((item, index) => {
            item.addEventListener('click', (e) => {
                e.stopPropagation(); if (isOn && index === activeIndex) executeSelection();
            });
        });

        window.addEventListener('wheel', (e) => {
            if (isOn && !body.classList.contains('terminal-active')) {
                if (e.deltaY > 0) { rotationY -= 90; activeIndex = (activeIndex + 1) % 4; } 
                else { rotationY += 90; activeIndex = (activeIndex - 1 + 4) % 4; }
                carousel.style.transform = `rotateY(${rotationY}deg)`;
            }
        });

        closeTerminalBtn.addEventListener('click', () => {
            swapTerminal.classList.remove('open'); body.classList.remove('terminal-active');
            isOn = false; body.classList.remove('is-on'); pText.innerText = "TAP TO INITIALIZE";
        });
    </script>
</body>
</html>
