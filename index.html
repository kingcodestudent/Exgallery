<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NO ART // NFT MINT</title>
    <!-- Web3 Ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <!-- Brutalist Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Infinite Scrolling Ticker (Like No Art) */
        .ticker-wrap {
            width: 100%;
            overflow: hidden;
            background-color: #ffffff;
            color: #000000;
            padding: 10px 0;
            border-bottom: 3px solid #000;
            white-space: nowrap;
        }

        .ticker {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 15s linear infinite;
            font-family: 'Anton', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Main Container */
        .container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Massive Typography */
        h1 {
            font-family: 'Anton', sans-serif;
            font-size: clamp(60px, 12vw, 150px);
            line-height: 0.9;
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-align: center;
        }

        .subtitle {
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-size: 14px;
            border: 2px solid #fff;
            padding: 5px 15px;
        }

        /* Brutalist Dropzone */
        .upload-area {
            width: 100%;
            max-width: 450px;
            border: 4px dashed #ffffff;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 30px;
            background: #000;
        }

        .upload-area:hover, .upload-area.dragover {
            background: #ffffff;
            color: #000000;
            border-style: solid;
        }

        .upload-area input { display: none; }
        
        #uploadText {
            font-family: 'Anton', sans-serif;
            font-size: 24px;
            letter-spacing: 1px;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            border: 4px solid #fff;
            margin-top: 20px;
            filter: grayscale(100%); /* Adds to the raw vibe, optional */
        }

        /* Brutalist Button */
        button {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            color: #000000;
            border: 4px solid #ffffff;
            padding: 20px;
            font-family: 'Anton', sans-serif;
            font-size: 32px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #000000;
            color: #ffffff;
        }

        #status {
            margin-top: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 14px;
            min-height: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Scrolling Ticker -->
    <div class="ticker-wrap">
        <div class="ticker">
            EXCLUSIVE DROP /// ARC NETWORK /// MINT YOUR ASSET /// NO RULES /// NO LIMITS /// EXCLUSIVE DROP /// ARC NETWORK /// MINT YOUR ASSET /// NO RULES /// NO LIMITS ///
        </div>
    </div>

    <div class="container">
        <h1>MINT.</h1>
        <div class="subtitle">SECURE ON BLOCKCHAIN</div>

        <label class="upload-area" id="dropzone" for="fileInput">
            <span id="uploadText">SELECT FILE</span>
            <input type="file" id="fileInput" accept="image/*">
            <img id="imagePreview" alt="Preview">
        </label>

        <button onclick="mintNFT()">EXECUTE</button>
        <div id="status">SYSTEM IDLE</div>
    </div>

    <script>
        // --- APNA CONTRACT ADDRESS YAHAN DAALEIN ---
        const contractAddress = "0x27dAF01a62674d66bC17019A554db1E07580168C";
        const contractABI = ["function mintNFT(address to) public"];

        // --- DRAG & DROP LOGIC ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadText = document.getElementById('uploadText');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            handleFiles(files[0]);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files[0]);
        });

        function handleFiles(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    uploadText.style.display = 'none';
                    document.getElementById('status').innerText = "ASSET LOADED";
                }
                reader.readAsDataURL(file);
            }
        }

        // --- MINTING LOGIC ---
        async function mintNFT() {
            const statusText = document.getElementById('status');

            if (!fileInput.files.length) {
                statusText.innerText = "ERROR: NO FILE SELECTED";
                return;
            }

            if (typeof window.ethereum === 'undefined') {
                statusText.innerText = "ERROR: METAMASK OFFLINE";
                return;
            }

            try {
                statusText.innerText = "CONNECTING...";
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const userAddress = await signer.getAddress();
                const contract = new ethers.Contract(contractAddress, contractABI, signer);

                statusText.innerText = "AWAITING CONFIRMATION...";
                
                const tx = await contract.mintNFT(userAddress);
                
                statusText.innerText = "WRITING TO BLOCKCHAIN...";
                await tx.wait();
                
                statusText.innerText = "SUCCESS: MINT COMPLETE";
            } catch (error) {
                console.error(error);
                statusText.innerText = "ERROR: TRANSACTION FAILED";
            }
        }
    </script>
</body>
</html>
