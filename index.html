<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Art Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        /* Classic Elegant Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #f7f7f5; /* Soft canvas white */
            color: #222;
            font-family: 'Lato', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* The Premium Frame */
        .gallery-frame {
            background: #ffffff;
            padding: 50px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            position: relative;
        }

        /* Inner subtle border like an art frame */
        .gallery-frame::before {
            content: '';
            position: absolute;
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border: 1px solid #eee;
            pointer-events: none;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            text-align: center;
            margin-bottom: 8px;
            color: #111;
            letter-spacing: 1px;
        }

        p.subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 35px;
            font-size: 14px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        /* Elegant Dropzone */
        .upload-area {
            border: 1px solid #ddd;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s ease;
            background: #fafafa;
            margin-bottom: 30px;
            position: relative;
        }

        .upload-area:hover, .upload-area.dragover {
            background: #f0f0f0;
            border-color: #aaa;
        }

        .upload-area input { display: none; }
        
        .upload-area span { 
            color: #555; 
            font-size: 13px; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
        }

        #imagePreview {
            max-width: 100%;
            max-height: 280px;
            margin-top: 20px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        /* Minimalist Button */
        button {
            width: 100%;
            background: #111;
            color: #fff;
            border: none;
            padding: 16px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-family: 'Lato', sans-serif;
            font-weight: bold;
        }

        button:hover { 
            background: #333; 
            transform: translateY(-2px);
        }

        #status {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #666;
            letter-spacing: 1px;
            min-height: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="gallery-frame">
        <h1>The Classic Studio</h1>
        <p class="subtitle">Preserving traditional art on the blockchain</p>

        <label class="upload-area" id="dropzone" for="fileInput">
            <span id="uploadText">Click or Drop Artwork Here</span>
            <input type="file" id="fileInput" accept="image/*">
            <img id="imagePreview" alt="Artwork Preview">
        </label>

        <button onclick="mintNFT()">Mint to Collection</button>
        
        <div id="status">Ready to Mint</div>
    </div>

    <script>
        // --- APNA CONTRACT ADDRESS YAHAN DAALEIN ---
        const contractAddress = "0x27dAF01a62674d66bC17019A554db1E07580168C";
        const contractABI = ["function mintNFT(address to) public"];

        // --- DRAG & DROP LOGIC ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadText = document.getElementById('uploadText');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
        });

        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            handleFiles(files[0]);
        });

        fileInput.addEventListener('change', function() {
            handleFiles(this.files[0]);
        });

        function handleFiles(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreview.style.display = 'block';
                    uploadText.style.display = 'none';
                    document.getElementById('status').innerText = "Artwork loaded.";
                }
                reader.readAsDataURL(file);
            }
        }

        // --- MINTING LOGIC ---
        async function mintNFT() {
            const statusText = document.getElementById('status');

            if (!fileInput.files.length) {
                statusText.innerText = "Please upload an artwork first.";
                return;
            }

            if (typeof window.ethereum === 'undefined') {
                statusText.innerText = "MetaMask not detected.";
                return;
            }

            try {
                statusText.innerText = "Connecting to MetaMask...";
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                const provider = new ethers.providers.Web3Provider(window.ethereum);
                const signer = provider.getSigner();
                const userAddress = await signer.getAddress();
                const contract = new ethers.Contract(contractAddress, contractABI, signer);

                statusText.innerText = "Please confirm in MetaMask...";
                
                const tx = await contract.mintNFT(userAddress);
                
                statusText.innerText = "Securing on Blockchain. Please wait...";
                await tx.wait();
                
                statusText.innerText = "Masterpiece Successfully Minted.";
            } catch (error) {
                console.error(error);
                statusText.innerText = "Transaction Cancelled or Failed.";
            }
        }
    </script>
</body>
</html>
