<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrixSwap - Omniverse Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Ethers.js library for Wallet Connection -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    
    <style>
        :root { --theme-color: #00ff66; --bg-color: #020202; }

        body {
            background-color: var(--bg-color); margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; font-family: 'Orbitron', sans-serif; overflow: hidden; user-select: none;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.02) 3px, transparent 4px);
            transition: background 0.5s ease;
        }

        /* --- WALLET HUD (TOP RIGHT) --- */
        .wallet-hud {
            position: absolute; top: 20px; right: 20px; padding: 10px 20px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.8); color: #fff; font-family: 'Share Tech Mono', monospace; font-size: 14px;
            border-radius: 5px; cursor: pointer; z-index: 100; display: flex; align-items: center; gap: 10px; transition: all 0.3s ease;
        }
        .wallet-hud:hover { border-color: var(--theme-color); box-shadow: 0 0 15px rgba(0,255,102,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .wallet-hud.connected .status-dot { background: #00ff66; box-shadow: 0 0 8px #00ff66; }

        /* --- BACKGROUND DECORATION --- */
        .bg-title { position: absolute; top: 12%; font-size: 42px; font-weight: 900; letter-spacing: 12px; color: var(--theme-color); opacity: 0.9; text-shadow: 0 0 20px var(--theme-color); z-index: 5; transition: opacity 0.3s; }
        .bg-orb { position: absolute; top: 50%; left: 50%; width: 500px; height: 500px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--theme-color) 0%, transparent 70%); opacity: 0.06; z-index: 1; pointer-events: none; }

        /* --- PROJECTOR BASE & BEAM --- */
        .projector-wrap { position: absolute; bottom: 50px; display: flex; flex-direction: column; align-items: center; cursor: pointer; z-index: 50; transition: opacity 0.3s; }
        .projector { width: 80px; height: 25px; background: #fff; border-radius: 50%; box-shadow: 0 0 30px var(--theme-color), 0 0 60px var(--theme-color); }
        .projector-text { margin-top: 12px; color: var(--theme-color); font-size: 12px; letter-spacing: 4px; }
        
        .beam { position: absolute; bottom: 60px; width: 350px; height: 400px; background: linear-gradient(to top, rgba(255,255,255,0.1), transparent); clip-path: polygon(50% 100%, 0 0, 100% 0); opacity: 0; transform-origin: bottom center; transition: opacity 0.5s; pointer-events: none; }

        /* --- 3D CAROUSEL (HOLOGRAM) --- */
        .scene { position: absolute; top: 25%; width: 300px; height: 200px; perspective: 1000px; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
        .carousel { width: 100%; height: 100%; position: absolute; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        .holo-item { position: absolute; width: 160px; height: 120px; left: 50%; top: 50%; margin-left: -80px; margin-top: -60px; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0.1; filter: blur(4px); transition: all 0.5s; }
        .holo-item .icon { font-size: 70px; margin-bottom: 10px; line-height: 1; }
        .holo-item .name { font-size: 22px; font-weight: 900; letter-spacing: 3px; }

        .item-0 { transform: rotateY(0deg) translateZ(180px); color: #00ff66; text-shadow: 0 0 20px #00ff66; }
        .item-1 { transform: rotateY(90deg) translateZ(180px); color: #00d4ff; text-shadow: 0 0 20px #00d4ff; }
        .item-2 { transform: rotateY(180deg) translateZ(180px); color: #b100ff; text-shadow: 0 0 20px #b100ff; }
        .item-3 { transform: rotateY(270deg) translateZ(180px); color: #ffea00; text-shadow: 0 0 20px #ffea00; }

        .holo-item.active { opacity: 1; filter: blur(0px); transform: scale(1.2); pointer-events: auto; cursor: pointer; }
        .item-0.active { transform: rotateY(0deg) translateZ(180px) scale(1.3); }
        .item-1.active { transform: rotateY(90deg) translateZ(180px) scale(1.3); }
        .item-2.active { transform: rotateY(180deg) translateZ(180px) scale(1.3); }
        .item-3.active { transform: rotateY(270deg) translateZ(180px) scale(1.3); }

        body.is-on .scene { opacity: 1; }
        body.is-on .beam { opacity: 1; }
        body.is-on .bg-title { opacity: 0.15; }

        /* --- THE NEW SWAP TERMINAL UI --- */
        .swap-terminal {
            position: absolute; top: 45%; left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 360px; background: rgba(5, 15, 5, 0.9); border: 2px solid var(--theme-color);
            box-shadow: 0 0 30px rgba(0,255,102,0.2), inset 0 0 20px rgba(0,255,102,0.1);
            border-radius: 15px; padding: 25px; z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Share Tech Mono', monospace; backdrop-filter: blur(10px);
        }

        .swap-terminal.open {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1; pointer-events: auto;
        }

        .terminal-header { text-align: center; font-size: 20px; font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--theme-color); letter-spacing: 3px; margin-bottom: 25px; text-shadow: 0 0 10px var(--theme-color); }
        
        .swap-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px; margin-bottom: 15px; position: relative; }
        .swap-label { display: block; font-size: 12px; color: #888; margin-bottom: 8px; }
        .swap-row { display: flex; justify-content: space-between; align-items: center; }
        
        /* Inputs */
        .swap-row input { background: transparent; border: none; color: #fff; font-size: 28px; width: 60%; font-family: 'Share Tech Mono', monospace; outline: none; }
        .swap-row input::placeholder { color: rgba(255,255,255,0.2); }
        
        /* Crypto Dropdowns */
        .swap-row select { background: rgba(0,255,102,0.1); color: var(--theme-color); border: 1px solid var(--theme-color); padding: 8px 12px; border-radius: 8px; font-weight: bold; font-family: 'Orbitron', sans-serif; outline: none; cursor: pointer; font-size: 14px; }
        .swap-row select option { background: #111; color: #fff; }

        /* The Swap Icon in middle */
        .swap-arrow { position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%); width: 30px; height: 30px; background: #111; border: 1px solid var(--theme-color); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: var(--theme-color); font-weight: bold; z-index: 10; font-family: 'Orbitron', sans-serif; cursor: pointer; }

        .execute-btn { width: 100%; padding: 18px; background: var(--theme-color); color: #000; border: none; border-radius: 10px; font-size: 16px; font-weight: 900; font-family: 'Orbitron', sans-serif; cursor: pointer; margin-top: 15px; transition: 0.3s; box-shadow: 0 0 15px rgba(0,255,102,0.4); }
        .execute-btn:hover { box-shadow: 0 0 25px var(--theme-color); transform: translateY(-2px); }

        .close-btn { position: absolute; top: 15px; right: 15px; background: transparent; color: #aaa; border: none; cursor: pointer; font-size: 20px; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }

        /* --- PLASMA FLASH --- */
        .flash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--theme-color); opacity: 0; pointer-events: none; z-index: 999; }
        .flash.fire { animation: slamFlash 0.5s ease-out; }
        @keyframes slamFlash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }

        /* Hide elements when terminal is open */
        body.terminal-active .scene, body.terminal-active .beam, body.terminal-active .projector-wrap { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div class="wallet-hud" id="wallet-btn">
        <div class="status-dot"></div>
        <span id="wallet-address">CONNECT WALLET</span>
    </div>

    <div class="bg-orb"></div>
    <div class="bg-title">TRIXSWAP</div>

    <div class="beam" id="beam"></div>

    <div class="scene" id="scene">
        <div class="carousel" id="carousel">
            <div class="holo-item item-0 active"><div class="icon">⇆</div><div class="name">SWAP</div></div>
            <div class="holo-item item-1"><div class="icon">🔗</div><div class="name">BRIDGE</div></div>
            <div class="holo-item item-2"><div class="icon">🌐</div><div class="name">CROSS</div></div>
            <div class="holo-item item-3"><div class="icon">💧</div><div class="name">POOLS</div></div>
        </div>
    </div>

    <div class="projector-wrap" id="projector">
        <div class="projector"></div>
        <div class="projector-text" id="p-text">TAP TO INITIALIZE</div>
    </div>

    <!-- NEW SWAP TERMINAL -->
    <div class="swap-terminal" id="swap-terminal">
        <button class="close-btn" id="close-terminal">✖</button>
        <div class="terminal-header">ROUTING PROTOCOL</div>
        
        <div class="swap-box">
            <span class="swap-label">YOU PAY</span>
            <div class="swap-row">
                <input type="number" placeholder="0.0" id="pay-input">
                <select id="pay-token">
                    <option value="AVAX">AVAX</option>
                    <option value="ETH">ETH</option>
                    <option value="BTC">BTC</option>
                    <option value="USDC">USDC</option>
                </select>
            </div>
            <div class="swap-arrow">↓</div>
        </div>

        <div class="swap-box" style="margin-top: -5px;">
            <span class="swap-label">YOU RECEIVE</span>
            <div class="swap-row">
                <input type="number" placeholder="0.0" id="receive-input" readonly>
                <select id="receive-token">
                    <option value="USDC">USDC</option>
                    <option value="USDT">USDT</option>
                    <option value="ETH">ETH</option>
                    <option value="AVAX">AVAX</option>
                </select>
            </div>
        </div>

        <button class="execute-btn" id="execute-swap-btn">CONFIRM TRANSACTION</button>
    </div>

    <div class="flash" id="flash"></div>

    <script>
        // --- WEB3 WALLET LOGIC ---
        const walletBtn = document.getElementById('wallet-btn');
        const walletAddressText = document.getElementById('wallet-address');
        let userAddress = null;

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    walletAddressText.innerText = "CONNECTING...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    userAddress = accounts[0];
                    walletBtn.classList.add('connected');
                    walletAddressText.innerText = userAddress.slice(0, 6) + "..." + userAddress.slice(-4);
                } catch (error) {
                    walletAddressText.innerText = "CONNECTION FAILED";
                    setTimeout(() => walletAddressText.innerText = "CONNECT WALLET", 2000);
                }
            } else {
                alert("No Web3 Wallet detected!");
            }
        }
        walletBtn.addEventListener('click', () => { if (!userAddress) connectWallet(); });


        // --- UI STATE MANAGEMENT ---
        const body = document.body;
        const projector = document.getElementById('projector');
        const carousel = document.getElementById('carousel');
        const pText = document.getElementById('p-text');
        const flash = document.getElementById('flash');
        
        // Terminal Elements
        const swapTerminal = document.getElementById('swap-terminal');
        const closeTerminalBtn = document.getElementById('close-terminal');
        const executeSwapBtn = document.getElementById('execute-swap-btn');
        
        let isOn = false; let rotationY = 0; let activeIndex = 0;
        const colors = ["#00ff66", "#00d4ff", "#b100ff", "#ffea00"];

        // Audio System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain); gain.connect(audioCtx.destination);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function updateUI() {
            document.querySelectorAll('.holo-item').forEach((item, index) => {
                if (index === activeIndex) item.classList.add('active');
                else item.classList.remove('active');
            });
            document.documentElement.style.setProperty('--theme-color', colors[activeIndex]);
        }

        // TRIGGER THE TERMINAL ON "SLAM"
        function executeSelection() {
            if (!userAddress) { alert("Access Denied: Please Connect Wallet First."); return; }
            
            playBeep(300, 0.4);
            flash.classList.add('fire');
            
            setTimeout(() => {
                flash.classList.remove('fire');
                
                // If "SWAP" (index 0) is selected, open the terminal
                if (activeIndex === 0) {
                    body.classList.add('terminal-active');
                    swapTerminal.classList.add('open');
                } else {
                    // For other options, just reset for now
                    isOn = false;
                    body.classList.remove('is-on');
                    pText.innerText = "TAP TO INITIALIZE";
                }
            }, 150);
        }

        // Projector click
        projector.addEventListener('click', () => {
            if (!isOn) {
                isOn = true; body.classList.add('is-on'); pText.innerText = "SCROLL MOUSE | TAP TO EXECUTE";
                playBeep(600, 0.2); updateUI();
            } else {
                executeSelection();
            }
        });

        // Click direct on hologram item
        document.querySelectorAll('.holo-item').forEach((item, index) => {
            item.addEventListener('click', (e) => {
                e.stopPropagation(); if (isOn && index === activeIndex) executeSelection();
            });
        });

        // Mouse Wheel scrolling
        window.addEventListener('wheel', (e) => {
            // Prevent scrolling rotation if the terminal is open
            if (isOn && !body.classList.contains('terminal-active')) {
                playBeep(1200, 0.05);
                if (e.deltaY > 0) { rotationY -= 90; activeIndex = (activeIndex + 1) % 4; } 
                else { rotationY += 90; activeIndex = (activeIndex - 1 + 4) % 4; }
                carousel.style.transform = `rotateY(${rotationY}deg)`;
                updateUI();
            }
        });

        // Close Terminal Button
        closeTerminalBtn.addEventListener('click', () => {
            swapTerminal.classList.remove('open');
            body.classList.remove('terminal-active');
            isOn = false;
            body.classList.remove('is-on');
            pText.innerText = "TAP TO INITIALIZE";
            playBeep(150, 0.3);
        });

        // Execute Final Transaction from Terminal
        executeSwapBtn.addEventListener('click', () => {
            if(!document.getElementById('pay-input').value) {
                alert("Please enter an amount to swap!");
                return;
            }
            executeSwapBtn.innerText = "PROCESSING ON-CHAIN...";
            executeSwapBtn.style.background = "#fff";
            
            // Mock transaction delay
            setTimeout(() => {
                alert("Transaction Sent to Network Successfully!");
                executeSwapBtn.innerText = "CONFIRM TRANSACTION";
                executeSwapBtn.style.background = "var(--theme-color)";
                closeTerminalBtn.click(); // Close terminal after success
            }, 2000);
        });
    </script>
</body>
</html>
